# שרת הרישוי + Caddy (תעודת HTTPS אוטומטית מ-Let's Encrypt).
# לפני ההפעלה: להעתיק את .env.example ל-.env ולמלא את RELAY_DOMAIN.
#   docker compose -f deploy/relay/docker-compose.yml up -d --build
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    volumes:
      - relay-data:/data
    # לא חשוף לאינטרנט — רק Caddy מדבר איתו
    expose:
      - "8443"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
