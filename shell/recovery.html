<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>SuperSuite — קוד שחזור</title>
<style>
  body{font-family:"Segoe UI",Arial,sans-serif;margin:0;padding:24px;background:#f6f7fb;color:#1f2937}
  h1{font-size:20px;margin:0 0 12px}
  p{line-height:1.6;margin:0 0 12px}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;direction:ltr;text-align:center;letter-spacing:1px;border:1px solid #cbd5e1;border-radius:8px}
  .err{color:#b91c1c;min-height:22px;margin:8px 0}
  .row{display:flex;gap:8px;margin-top:12px}
  button{flex:1;padding:10px;font-size:15px;border-radius:8px;border:0;cursor:pointer}
  #ok{background:#2563eb;color:#fff}
  #cancel{background:#e5e7eb}
</style>
</head>
<body>
<h1>🔑 נדרש קוד השחזור</h1>
<p>הנתונים במחשב הזה מוצפנים, אבל מפתח ההצפנה לא נמצא בחשבון Windows הנוכחי. זה קורה אחרי התקנה מחדש של Windows, מעבר למחשב אחר או כניסה עם משתמש אחר.</p>
<p>הקלידו את קוד השחזור שנרשם (55 תווים). אין קוד? לחצו "ביטול" ושחזרו מגיבוי שנשמר בסיסמה.</p>
<input id="code" autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX-...">
<div class="err" id="err"></div>
<div class="row"><button id="ok">פתיחה</button><button id="cancel">ביטול</button></div>
<script src="recovery.js"></script>
</body>
</html>
