# עדכוני אבטחה אוטומטיים לתלויות: Dependabot פותח PR כשמתגלה חולשה או גרסה חדשה
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # גרסה חדשה מוצעת רק אחרי שבוע — זמן לגילוי חבילה זדונית לפני שהיא נכנסת
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /modules-src/trainer
    schedule:
      interval: weekly
    # גרסה חדשה מוצעת רק אחרי שבוע — זמן לגילוי חבילה זדונית לפני שהיא נכנסת
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /tools/passwords
    schedule:
      interval: weekly
    # גרסה חדשה מוצעת רק אחרי שבוע — זמן לגילוי חבילה זדונית לפני שהיא נכנסת
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # גרסה חדשה מוצעת רק אחרי שבוע — זמן לגילוי חבילה זדונית לפני שהיא נכנסת
    cooldown:
      default-days: 7
