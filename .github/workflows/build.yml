name: Build Windows installer
on:
  # "גרסה להפצה" (PLAN.md 4.5): הפעלה ידנית עם release — הבנייה נכשלת אם הרישוי לא הופעל (tools/release-check.js)
  workflow_dispatch:
    inputs:
      release:
        description: 'גרסה להפצה ללקוחות (נכשל אם root-keys.js ריק)'
        type: boolean
        default: false
      # קישור הורדה קבוע (PLAN.md 1.1): מעלה את המתקין למאגר ההורדות הציבורי (משימת publish למטה)
      publish:
        description: 'לפרסם את המתקין במאגר ההורדות הציבורי'
        type: boolean
        default: false
  push:
    # build/** — בנייה מענף עבודה לפני מיזוג, בלי לגעת ב-master
    branches: [master, 'build/**']
    # תגית גרסה (v3.11.0) ← בנייה ופרסום במאגר ההורדות (PLAN.md 1.1). דף ה-Actions חסום ב-NetFree, ותגית אפשר לדחוף ב-git
    tags: ['v*']
# יומני הבנייה נכתבים גם לענף ci-status (משימת report): דף היומנים של GitHub Actions חסום ב-NetFree,
# וכך אפשר לקרוא את התוצאה ב-git fetch origin ci-status.
# ריצה אחת בכל פעם: כל ריצה דורסת את ci-status, ושתי ריצות חופפות היו מוחקות זו לזו את היומנים.
# ריצה שמפרסמת (תגית v* או publish) — בקבוצה משלה: GitHub משאיר רק ריצה ממתינה אחת בקבוצה, ודחיפה נוספת
# הייתה מבטלת בשקט פרסום שממתין (סקירת קוד 2.11.2026). הדחיפה ל-ci-status עצמה מסודרת בתור במשימת report
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && format('publish-{0}', github.ref) || 'ci-status' }}
  cancel-in-progress: false
jobs:
  # משימה אחת: הבדיקות, הכיווץ, האריזה ובדיקת העלייה.
  # בלי artifacts בין משימות: כשמכסת האחסון של המאגר מלאה (ריצות #54–#59) העברת קבצים בין משימות נכשלה,
  # וכל הבנייה נעצרה אף שהבדיקות עברו. היומנים (ובפרסום — המתקין) עוברים ב-actions/cache, שאינו במכסה הזו.
  # קריאה בלבד: כאן רץ קוד של צד שלישי (npm install, electron-builder) — בלי טוקן כתיבה למאגר ובלי טוקן הפרסום
  build:
    runs-on: windows-latest
    # בלי זמן קצוב: צעד תקוע תופס מכונה עד 6 שעות ומעכב את כל הריצות שבתור (סקירת קוד 2.11.2026)
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      LOG: ${{ github.workspace }}/ci-logs/build.log
    defaults:
      run:
        shell: bash
    steps:
      # היסטוריה מלאה: tests/at-rest.test.js קורא את database.js של 3.10.0 מ-git (בדיקת שדרוג)
      # persist-credentials: false — הטוקן לא נשאר ב-.git/config, שסקריפט התקנה של חבילה יכול לקרוא
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: mkdir -p ci-logs
      # "גרסה להפצה" — ראשון: לא תלוי בחבילות, ונכשל בתוך שניות ולא אחרי ההתקנות והבדיקות.
      # גם בכל פרסום (תגית v* או publish): מתקין לציבור לא יוצא בלי מפתח שורש ושרת https (בדיקת קוד 23.10.2026).
      # התנאי חייב לכסות את התנאי של משימת publish (tests/audit-ci-tools-tests.test.js)
      - name: Release check
        if: ${{ inputs.release || inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        run: set -o pipefail; { echo "== release-check"; node tools/release-check.js 2>&1; } | tee -a "$LOG"
      # עם קובץ נעילה — אותן גרסאות בדיוק בכל בנייה (npm ci); בלעדיו — npm install, והקובץ שנוצר נשמר ב-ci-status
      # esbuild לכיווץ — מקובץ הנעילה שלו בלבד (tools/minify-deps), בלי סודות. לא נארז בתוכנה
      - name: npm ci (minify)
        working-directory: tools/minify-deps
        run: set -o pipefail; { echo "== npm ci (minify)"; npm ci 2>&1; } | tee -a "$LOG"
      # גם בשורש: npm ci רק כשקובץ הנעילה כולל את node-llama-cpp (אחרת npm ci נכשל על אי-התאמה).
      # הקובץ שנוצר נשמר ב-ci-status (root-package-lock.json) — אחרי commit שלו, כל בנייה מקבלת אותן גרסאות בדיוק.
      # node-llama-cpp בגרסה מדויקת ב-package.json: הוא נפרס ל-app.asar.unpacked, מחוץ לבדיקת השלמות של app.asar
      - name: npm install
        run: |
          set -o pipefail
          if grep -q '"node_modules/node-llama-cpp"' package-lock.json; then CMD="npm ci"; else CMD="npm install"; fi
          { echo "== $CMD"; $CMD 2>&1; } | tee -a "$LOG"
          cp package-lock.json ci-logs/root-package-lock.json
      # הבדיקות רצות על הקוד המקורי, לפני הכיווץ
      - name: npm test
        timeout-minutes: 40
        run: set -o pipefail; { echo "== npm test"; npm test 2>&1; } | tee -a "$LOG"
      # כיווץ הקוד (PLAN.md 3.5) — במקום, בעותק של GitHub בלבד, אחרי הבדיקות.
      # צעד נפרד בלי סודות החתימה, ובלי npm install: esbuild הנעול (tools/minify-deps/package-lock.json)
      - name: minify
        env:
          NODE_PATH: ${{ github.workspace }}/tools/minify-deps/node_modules
        run: set -o pipefail; { echo "== minify"; node tools/minify.js 2>&1; } | tee -a "$LOG"
      # --publish never: בלי זה electron-builder מזהה CI ומנסה לפרסם ל-GitHub Releases (ונכשל בלי GH_TOKEN).
      # פרסום גרסאות — משימת publish למטה (PLAN.md 1.1), למאגר ההורדות הציבורי.
      # חתימת קוד — רק אם הוגדרו סודות במאגר (docs/CODE-SIGNING.md). בלי סודות: בנייה לא חתומה, כמו קודם.
      # טוקן USB אינו זמין בשרת של GitHub — כאן אפשר רק PFX או Azure Trusted Signing.
      # הסודות רק בצעד הזה, ובו אין התקנת חבילות — רק electron-builder מקובץ הנעילה, שחותם בעצמו.
      # node ישירות על cli.js (כמו build-local.js), לא npx: בלי הורדה מה-registry כשהחבילה חסרה, ובלי cmd.exe בדרך
      - name: Build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SS_AZURE_ENDPOINT: ${{ secrets.SS_AZURE_ENDPOINT }}
          SS_AZURE_ACCOUNT: ${{ secrets.SS_AZURE_ACCOUNT }}
          SS_AZURE_PROFILE: ${{ secrets.SS_AZURE_PROFILE }}
          SS_SIGN_PUBLISHER: ${{ secrets.SS_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -eo pipefail
          # דגל אחד בכל שורה, למערך: ערך עם רווח (SS_SIGN_PUBLISHER="Bunim Seller") נשאר ארגומנט אחד
          node tools/code-signing.js --args > "$RUNNER_TEMP/sign-args.txt"
          mapfile -t ARGS < "$RUNNER_TEMP/sign-args.txt"
          { echo "== code-signing"; node tools/code-signing.js 2>&1; } | tee -a "$LOG"
          # ארבע המהדורות (shell/edition.js) במשימה הזו, בלולאה — לא matrix (מכסת האחסון, ראו למעלה).
          # המלאה ראשונה, בשמות ובתיקייה של היום; כל מהדורה אחרת — dist/<id>/ (tools/edition-build.js)
          trap 'node tools/edition-build.js set full' EXIT
          for ED in $(node tools/edition-build.js list); do
            node tools/edition-build.js set "$ED" | tee -a "$LOG"
            node tools/edition-build.js --args "$ED" > "$RUNNER_TEMP/edition-args.txt"
            mapfile -t EDARGS < "$RUNNER_TEMP/edition-args.txt"
            { echo "== electron-builder ($ED)"; node node_modules/electron-builder/out/cli/cli.js --win nsis portable --publish never "${ARGS[@]}" "${EDARGS[@]}" 2>&1; } | tee -a "$LOG"
          done
      # הגרסה הארוזה והמכווצת: עולה בלי שגיאות, ומסרבת לעלות עם פרמטר דיבוג או עם app.asar שהשתנה.
      # נכשל ← אין פרסום (הצעדים הבאים מדולגים)
      - name: Smoke test (packaged)
        env:
          SMOKE_LOG: ${{ github.workspace }}/ci-logs/smoke.log
        # כל מהדורה בתורה; מהדורה שנכשלה לא עוצרת את הבדיקה של האחרות, אבל הצעד נכשל
        run: |
          set -o pipefail
          FAIL=0
          for ED in $(node tools/edition-build.js list); do
            { echo "== smoke ($ED)"; node tools/smoke-packaged.js --edition "$ED" 2>&1; } | tee -a "$LOG" || FAIL=1
          done
          exit $FAIL
      # המתקין למשימת publish — רק כשמפרסמים, ורק אחרי בנייה ובדיקת עלייה שעברו (צעד בלי always())
      - name: installer for publish
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
            dist/npo/SuperSuite-Amutot-Setup.exe
            dist/npo/SuperSuite-Amutot-Portable.exe
            dist/realty/SuperSuite-Nadlan-Setup.exe
            dist/realty/SuperSuite-Nadlan-Portable.exe
            dist/acct/SuperSuite-Heshbonaut-Setup.exe
            dist/acct/SuperSuite-Heshbonaut-Portable.exe
          key: installer-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      # עותק להורדה ישירה (ענף build/exe-download-npo בלבד): כל שמונת המתקינים ל-cache עבור משימת download למטה
      - name: installer for download
        if: ${{ github.ref == 'refs/heads/build/exe-download-npo' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
            dist/npo/SuperSuite-Amutot-Setup.exe
            dist/npo/SuperSuite-Amutot-Portable.exe
            dist/realty/SuperSuite-Nadlan-Setup.exe
            dist/realty/SuperSuite-Nadlan-Portable.exe
            dist/acct/SuperSuite-Heshbonaut-Setup.exe
            dist/acct/SuperSuite-Heshbonaut-Portable.exe
          key: installer-dl-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      # רכיב ההרצה של המודל המקומי — למחשב, דרך ci-status: node tools/llm-runtime.js fetch.
      # אחרי ה-Build ובדיקת העלייה (סקירת קוד 2.11.2026): מקובץ הנעילה הייעודי (tools/llm-runtime-deps) ב-npm ci
      # --ignore-scripts, כך ששום קוד של התלויות לא רץ לפני האריזה; SHA-256 של העץ ב-llm-runtime.json וביומן.
      # תוספת בלבד: כישלון כאן לא עוצר את הבנייה (ריצה #62)
      - name: llm runtime for ci-status
        continue-on-error: true
        timeout-minutes: 20
        run: set -o pipefail; { echo "== llm-runtime"; node tools/llm-runtime.js pack ci-logs/llm-runtime 2>&1; } | tee -a "$LOG"
      # היומנים למשימת report — תמיד, גם אחרי כישלון
      - name: logs for report
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ci-logs
          key: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
  # פרסום למאגר ההורדות הציבורי (PLAN.md 1.1) — רק מתגית גרסה או בהפעלה ידנית עם publish, ורק אחרי בנייה ובדיקת עלייה שעברו.
  # משימה נפרדת על מכונה נקייה: טוקן הפרסום לא נמצא במכונה שהריצה קוד של חבילות npm.
  # המאגר הזה פרטי; ההורדות במאגר ציבורי נפרד (משתנה SS_DOWNLOADS_REPO, למשל owner/SuperSuite-Downloads),
  # עם טוקן שמורשה לכתוב רק אליו (סוד SS_DOWNLOADS_TOKEN). מדריך: docs/DOWNLOADS.md.
  # קישור קבוע לגרסה האחרונה: https://github.com/<מאגר>/releases/latest/download/SuperSuite-Setup.exe
  publish:
    needs: [build]
    if: ${{ (inputs.publish || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { sparse-checkout: package.json, sparse-checkout-cone-mode: false, persist-credentials: false }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
            dist/npo/SuperSuite-Amutot-Setup.exe
            dist/npo/SuperSuite-Amutot-Portable.exe
            dist/realty/SuperSuite-Nadlan-Setup.exe
            dist/realty/SuperSuite-Nadlan-Portable.exe
            dist/acct/SuperSuite-Heshbonaut-Setup.exe
            dist/acct/SuperSuite-Heshbonaut-Portable.exe
          key: installer-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SS_DOWNLOADS_TOKEN }}
          REPO: ${{ vars.SS_DOWNLOADS_REPO }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$REPO" ]; then
            echo "חסרים SS_DOWNLOADS_TOKEN או SS_DOWNLOADS_REPO — ראו docs/DOWNLOADS.md"; exit 1
          fi
          V="$(node -p "require('./package.json').version")"
          # תגית שלא תואמת את package.json — טעות; לא מפרסמים
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "התגית ${GITHUB_REF_NAME} לא תואמת לגרסה v$V שב-package.json"; exit 1
          fi
          # גרסה שכבר פורסמה לא נדרסת — יש להעלות את מספר הגרסה ב-package.json
          if gh release view "v$V" --repo "$REPO" >/dev/null 2>&1; then
            echo "הגרסה v$V כבר פורסמה ב-$REPO"; exit 1
          fi
          # ארבע המהדורות באותה גרסה; המלאה בשם של היום — הקישור הקבוע הקיים לא משתנה
          gh release create "v$V" --repo "$REPO" --title "SuperSuite $V" --latest --notes "SuperSuite גרסה $V — עמותות, נדל\"ן ועסקים, חשבונאות והמלאה" \
            dist/SuperSuite-Setup.exe dist/SuperSuite-Portable.exe \
            dist/npo/SuperSuite-Amutot-Setup.exe dist/npo/SuperSuite-Amutot-Portable.exe \
            dist/realty/SuperSuite-Nadlan-Setup.exe dist/realty/SuperSuite-Nadlan-Portable.exe \
            dist/acct/SuperSuite-Heshbonaut-Setup.exe dist/acct/SuperSuite-Heshbonaut-Portable.exe
          echo "פורסם: https://github.com/$REPO/releases/latest/download/SuperSuite-Setup.exe"
          echo "עמותות: https://github.com/$REPO/releases/latest/download/SuperSuite-Amutot-Setup.exe"
          echo "נדל\"ן ועסקים: https://github.com/$REPO/releases/latest/download/SuperSuite-Nadlan-Setup.exe"
          echo "חשבונאות: https://github.com/$REPO/releases/latest/download/SuperSuite-Heshbonaut-Setup.exe"
  # היומנים והסיכום לענף ci-status (קומיט אחד לריצה, נדרס בכל ריצה). הענף לא מפעיל בנייה.
  # רק כאן יש הרשאת כתיבה, ואין כאן קוד של צד שלישי
  report:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ריצת פרסום ורגילה יכולות לרוץ יחד (קבוצות נפרדות) — הדחיפה ל-ci-status אחת-אחת
    concurrency:
      group: ci-status-push
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ci-logs
          key: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      # מצב כל משימה וכל צעד והודעות השגיאה של GitHub — צעד אחד, עוזר API אחד.
      # דף ה-Actions וה-API חסומים ב-NetFree, ולכן הכול נכתב ל-ci-status (jobs.txt)
      - name: jobs summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # בלי -e: שגיאת API בפקודה אחת לא קוטעת את שאר הדוח
          set +e
          mkdir -p logs
          out=logs/jobs.txt
          repo="https://api.github.com/repos/$GITHUB_REPOSITORY"
          api() { curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # GitHub מעדכן את מצב המשימה ואת הודעות השגיאה שלה כמה שניות אחרי שהיא נגמרת (בריצה #59 עוד "in_progress",
          # בלי הודעות) — ממתינים עד דקה שכל משימה חוץ מזו תסומן completed
          for i in $(seq 1 12); do
            api "$repo/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > jobs.json
            pending=$(jq '[.jobs[]? | select(.name != "report" and .status != "completed")] | length' jobs.json 2>/dev/null)
            [ "${pending:-0}" -eq 0 ] && break
            sleep 5
          done
          jq -r '.jobs[]? | "\(.name): \(.conclusion // .status)", (.steps[]? | "  \(.number). \(.name): \(.conclusion // .status)")' jobs.json > "$out" \
            || echo "--- jobs: API error: $(head -c 300 jobs.json)" >> "$out"
          # הודעות השגיאה לכל משימה שאינה "success" (גם כשהיא עוד נסגרת בזמן שהדוח נכתב)
          for id in $(jq -r '.jobs[]? | select(.name != "report" and .conclusion != "success" and .conclusion != "skipped") | .id' jobs.json 2>/dev/null); do
            echo "--- annotations: job $id" >> "$out"
            api "$repo/check-runs/$id/annotations" | jq -r '.[]? | "\(.annotation_level): \(.message)"' >> "$out"
          done
      - name: push ci-status
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # היומנים ממשימת build; אם היא נפלה לפני שמירתם — רק הסיכום
          mkdir -p ci-logs logs && cd ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-status
          cp ../logs/jobs.txt . 2>/dev/null || true
          printf 'run: %s (#%s)\nsha: %s\nbuild: %s\npublish: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "${{ needs.build.result }}" "${{ needs.publish.result }}" > summary.txt
          git add -A
          git commit -qm "CI #$GITHUB_RUN_NUMBER $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status

  # הורדה ישירה (ענף build/exe-download-npo בלבד): גרסת בדיקה של כל המהדורות כ-release במאגר הזה, להורדה דרך ה-API
  download:
    needs: build
    if: ${{ github.ref == 'refs/heads/build/exe-download-npo' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
            dist/npo/SuperSuite-Amutot-Setup.exe
            dist/npo/SuperSuite-Amutot-Portable.exe
            dist/realty/SuperSuite-Nadlan-Setup.exe
            dist/realty/SuperSuite-Nadlan-Portable.exe
            dist/acct/SuperSuite-Heshbonaut-Setup.exe
            dist/acct/SuperSuite-Heshbonaut-Portable.exe
          key: installer-dl-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="exe-download-npo-${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "גרסת בדיקה (כל המהדורות) $TAG" --notes "בנייה להורדה ישירה של כל המהדורות (לא גרסה להפצה)" \
            dist/SuperSuite-Setup.exe dist/SuperSuite-Portable.exe \
            dist/npo/SuperSuite-Amutot-Setup.exe dist/npo/SuperSuite-Amutot-Portable.exe \
            dist/realty/SuperSuite-Nadlan-Setup.exe dist/realty/SuperSuite-Nadlan-Portable.exe \
            dist/acct/SuperSuite-Heshbonaut-Setup.exe dist/acct/SuperSuite-Heshbonaut-Portable.exe
