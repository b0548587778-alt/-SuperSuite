name: Build Windows installer
on:
  # "גרסה להפצה" (PLAN.md 4.5): הפעלה ידנית עם release — הבנייה נכשלת אם הרישוי לא הופעל (tools/release-check.js)
  workflow_dispatch:
    inputs:
      release:
        description: 'גרסה להפצה ללקוחות (נכשל אם root-keys.js ריק)'
        type: boolean
        default: false
      # קישור הורדה קבוע (PLAN.md 1.1): מעלה את המתקין למאגר ההורדות הציבורי (משימת publish למטה)
      publish:
        description: 'לפרסם את המתקין במאגר ההורדות הציבורי'
        type: boolean
        default: false
  push:
    # build/** — בניית מודול האימונים מענף עבודה לפני מיזוג (vite חסום ב-NetFree), בלי לגעת ב-master
    branches: [master, 'build/**']
    # תגית גרסה (v3.11.0) ← בנייה ופרסום במאגר ההורדות (PLAN.md 1.1). דף ה-Actions חסום ב-NetFree, ותגית אפשר לדחוף ב-git
    tags: ['v*']
# יומני הבנייה נכתבים גם לענף ci-status (משימת report): דף היומנים של GitHub Actions חסום ב-NetFree,
# וכך אפשר לקרוא את התוצאה ב-git fetch origin ci-status.
# ריצה אחת בכל פעם: כל ריצה דורסת את ci-status, ושתי ריצות חופפות היו מוחקות זו לזו את היומנים
concurrency:
  group: ci-status
  cancel-in-progress: false
jobs:
  # משימה אחת: מודול האימונים מקוד המקור (modules-src/trainer; vite חסום ב-NetFree), הבדיקות, האריזה ובדיקת העלייה.
  # בלי artifacts בין משימות: כשמכסת האחסון של המאגר מלאה (ריצות #54–#59) העברת קבצים בין משימות נכשלה,
  # וכל הבנייה נעצרה אף שהבדיקות עברו. היומנים (ובפרסום — המתקין) עוברים ב-actions/cache, שאינו במכסה הזו.
  # קריאה בלבד: כאן רץ קוד של צד שלישי (npm install, electron-builder) — בלי טוקן כתיבה למאגר ובלי טוקן הפרסום
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      LOG: ${{ github.workspace }}/ci-logs/build.log
    defaults:
      run:
        shell: bash
    steps:
      # היסטוריה מלאה: tests/at-rest.test.js קורא את database.js של 3.10.0 מ-git (בדיקת שדרוג)
      # persist-credentials: false — הטוקן לא נשאר ב-.git/config, שסקריפט התקנה של חבילה יכול לקרוא
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p ci-logs
      # "גרסה להפצה" — ראשון: לא תלוי בחבילות, ונכשל בתוך שניות ולא אחרי ההתקנות והבדיקות
      - name: Release check
        if: ${{ inputs.release }}
        run: set -o pipefail; { echo "== release-check"; node tools/release-check.js 2>&1; } | tee -a "$LOG"
      # עם קובץ נעילה — אותן גרסאות בדיוק בכל בנייה (npm ci); בלעדיו — npm install, והקובץ שנוצר נשמר ב-ci-status
      - name: npm install (trainer)
        working-directory: modules-src/trainer
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then CMD="npm ci"; else CMD="npm install"; fi
          { echo "== $CMD (trainer)"; $CMD 2>&1; } | tee -a "$LOG"
          cp package-lock.json "$GITHUB_WORKSPACE/ci-logs/trainer-package-lock.json"
      # גם בשורש: npm ci רק כשקובץ הנעילה כולל את node-llama-cpp (אחרת npm ci נכשל על אי-התאמה).
      # הקובץ שנוצר נשמר ב-ci-status (root-package-lock.json) — אחרי commit שלו, כל בנייה מקבלת אותן גרסאות בדיוק
      - name: npm install
        run: |
          set -o pipefail
          if grep -q '"node_modules/node-llama-cpp"' package-lock.json; then CMD="npm ci"; else CMD="npm install"; fi
          { echo "== $CMD"; $CMD 2>&1; } | tee -a "$LOG"
          cp package-lock.json ci-logs/root-package-lock.json
      # המתקין אורז את מודול האימונים שנבנה מהמקור באותה ריצה (PLAN.md 6.1), לא את העותק שבמאגר.
      # עותק לפני הכיווץ — למחשב, דרך ci-status: git checkout FETCH_HEAD -- trainer-module
      - name: build trainer
        run: |
          set -o pipefail
          { echo "== build-trainer"; node tools/build-trainer.js 2>&1; } | tee -a "$LOG"
          cp -r modules/trainer ci-logs/trainer-module
      # הבדיקות רצות על הקוד המקורי, לפני הכיווץ
      - name: npm test
        run: set -o pipefail; { echo "== npm test"; npm test 2>&1; } | tee -a "$LOG"
      # --publish never: בלי זה electron-builder מזהה CI ומנסה לפרסם ל-GitHub Releases (ונכשל בלי GH_TOKEN).
      # פרסום גרסאות — משימת publish למטה (PLAN.md 1.1), למאגר ההורדות הציבורי.
      # חתימת קוד — רק אם הוגדרו סודות במאגר (docs/CODE-SIGNING.md). בלי סודות: בנייה לא חתומה, כמו קודם.
      # טוקן USB אינו זמין בשרת של GitHub — כאן אפשר רק PFX או Azure Trusted Signing.
      - name: Build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SS_AZURE_ENDPOINT: ${{ secrets.SS_AZURE_ENDPOINT }}
          SS_AZURE_ACCOUNT: ${{ secrets.SS_AZURE_ACCOUNT }}
          SS_AZURE_PROFILE: ${{ secrets.SS_AZURE_PROFILE }}
          SS_SIGN_PUBLISHER: ${{ secrets.SS_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -o pipefail
          ARGS="$(node tools/code-signing.js --args)"
          { echo "== code-signing"; node tools/code-signing.js 2>&1; } | tee -a "$LOG"
          # כיווץ הקוד (PLAN.md 3.5) — במקום, בעותק של GitHub בלבד, אחרי הבדיקות
          { echo "== minify"; npm install --no-save esbuild 2>&1 && node tools/minify.js 2>&1; } | tee -a "$LOG"
          { echo "== electron-builder"; npx electron-builder --win nsis portable --publish never $ARGS 2>&1; } | tee -a "$LOG"
      # הגרסה הארוזה והמכווצת: עולה בלי שגיאות, ומסרבת לעלות עם פרמטר דיבוג או עם app.asar שהשתנה.
      # נכשל ← אין פרסום (הצעדים הבאים מדולגים)
      - name: Smoke test (packaged)
        env:
          SMOKE_LOG: ${{ github.workspace }}/ci-logs/smoke.log
        run: set -o pipefail; { echo "== smoke"; node tools/smoke-packaged.js 2>&1; } | tee -a "$LOG"
      # המתקין למשימת publish — רק כשמפרסמים, ורק אחרי בנייה ובדיקת עלייה שעברו (צעד בלי always())
      - name: installer for publish
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/save@v4
        with:
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
          key: installer-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      # היומנים והמודול הבנוי למשימת report — תמיד, גם אחרי כישלון
      - name: logs for report
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ci-logs
          key: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
  # פרסום למאגר ההורדות הציבורי (PLAN.md 1.1) — רק מתגית גרסה או בהפעלה ידנית עם publish, ורק אחרי בנייה ובדיקת עלייה שעברו.
  # משימה נפרדת על מכונה נקייה: טוקן הפרסום לא נמצא במכונה שהריצה קוד של חבילות npm.
  # המאגר הזה פרטי; ההורדות במאגר ציבורי נפרד (משתנה SS_DOWNLOADS_REPO, למשל owner/SuperSuite-Downloads),
  # עם טוקן שמורשה לכתוב רק אליו (סוד SS_DOWNLOADS_TOKEN). מדריך: docs/DOWNLOADS.md.
  # קישור קבוע לגרסה האחרונה: https://github.com/<מאגר>/releases/latest/download/SuperSuite-Setup.exe
  publish:
    needs: [build]
    if: ${{ (inputs.publish || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: package.json, sparse-checkout-cone-mode: false, persist-credentials: false }
      - uses: actions/cache/restore@v4
        with:
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
          key: installer-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SS_DOWNLOADS_TOKEN }}
          REPO: ${{ vars.SS_DOWNLOADS_REPO }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$REPO" ]; then
            echo "חסרים SS_DOWNLOADS_TOKEN או SS_DOWNLOADS_REPO — ראו docs/DOWNLOADS.md"; exit 1
          fi
          V="$(node -p "require('./package.json').version")"
          # תגית שלא תואמת את package.json — טעות; לא מפרסמים
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "התגית ${GITHUB_REF_NAME} לא תואמת לגרסה v$V שב-package.json"; exit 1
          fi
          # גרסה שכבר פורסמה לא נדרסת — יש להעלות את מספר הגרסה ב-package.json
          if gh release view "v$V" --repo "$REPO" >/dev/null 2>&1; then
            echo "הגרסה v$V כבר פורסמה ב-$REPO"; exit 1
          fi
          gh release create "v$V" --repo "$REPO" --title "SuperSuite $V" --latest --notes "SuperSuite גרסה $V" dist/SuperSuite-Setup.exe dist/SuperSuite-Portable.exe
          echo "פורסם: https://github.com/$REPO/releases/latest/download/SuperSuite-Setup.exe"
  # היומנים, המודול הבנוי והסיכום לענף ci-status (קומיט אחד לריצה, נדרס בכל ריצה). הענף לא מפעיל בנייה.
  # רק כאן יש הרשאת כתיבה, ואין כאן קוד של צד שלישי
  report:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ci-logs
          key: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      # מצב כל משימה וכל צעד והודעות השגיאה של GitHub — צעד אחד, עוזר API אחד.
      # דף ה-Actions וה-API חסומים ב-NetFree, ולכן הכול נכתב ל-ci-status (jobs.txt)
      - name: jobs summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # בלי -e: שגיאת API בפקודה אחת לא קוטעת את שאר הדוח
          set +e
          mkdir -p logs
          out=logs/jobs.txt
          repo="https://api.github.com/repos/$GITHUB_REPOSITORY"
          api() { curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # GitHub מעדכן את מצב המשימה ואת הודעות השגיאה שלה כמה שניות אחרי שהיא נגמרת (בריצה #59 עוד "in_progress",
          # בלי הודעות) — ממתינים עד דקה שכל משימה חוץ מזו תסומן completed
          for i in $(seq 1 12); do
            api "$repo/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > jobs.json
            pending=$(jq '[.jobs[]? | select(.name != "report" and .status != "completed")] | length' jobs.json 2>/dev/null)
            [ "${pending:-0}" -eq 0 ] && break
            sleep 5
          done
          jq -r '.jobs[]? | "\(.name): \(.conclusion // .status)", (.steps[]? | "  \(.number). \(.name): \(.conclusion // .status)")' jobs.json > "$out" \
            || echo "--- jobs: API error: $(head -c 300 jobs.json)" >> "$out"
          # הודעות השגיאה לכל משימה שאינה "success" (גם כשהיא עוד נסגרת בזמן שהדוח נכתב)
          for id in $(jq -r '.jobs[]? | select(.name != "report" and .conclusion != "success" and .conclusion != "skipped") | .id' jobs.json 2>/dev/null); do
            echo "--- annotations: job $id" >> "$out"
            api "$repo/check-runs/$id/annotations" | jq -r '.[]? | "\(.annotation_level): \(.message)"' >> "$out"
          done
      - name: push ci-status
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # היומנים והמודול ממשימת build; אם היא נפלה לפני שמירתם — רק הסיכום
          mkdir -p ci-logs logs && cd ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-status
          cp ../logs/jobs.txt . 2>/dev/null || true
          printf 'run: %s (#%s)\nsha: %s\nbuild: %s\npublish: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "${{ needs.build.result }}" "${{ needs.publish.result }}" > summary.txt
          git add -A
          git commit -qm "CI #$GITHUB_RUN_NUMBER $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status
