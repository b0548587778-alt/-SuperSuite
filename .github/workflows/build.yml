name: Build Windows installer
on:
  # "גרסה להפצה" (PLAN.md 4.5): הפעלה ידנית עם release — הבנייה נכשלת אם הרישוי לא הופעל (tools/release-check.js)
  workflow_dispatch:
    inputs:
      release:
        description: 'גרסה להפצה ללקוחות (נכשל אם root-keys.js ריק)'
        type: boolean
        default: false
      # קישור הורדה קבוע (PLAN.md 1.1): מעלה את המתקין למאגר ההורדות הציבורי (משימת publish למטה)
      publish:
        description: 'לפרסם את המתקין במאגר ההורדות הציבורי'
        type: boolean
        default: false
  push:
    # build/** — בניית מודול האימונים מענף עבודה לפני מיזוג (vite חסום ב-NetFree), בלי לגעת ב-master
    branches: [master, 'build/**']
    # תגית גרסה (v3.11.0) ← בנייה ופרסום במאגר ההורדות (PLAN.md 1.1). דף ה-Actions חסום ב-NetFree, ותגית אפשר לדחוף ב-git
    tags: ['v*']
# יומני הבנייה נכתבים גם לענף ci-status (משימת report): דף היומנים של GitHub Actions חסום ב-NetFree,
# וכך אפשר לקרוא את התוצאה ב-git fetch origin ci-status.
jobs:
  # מודול האימונים מקוד המקור (modules-src/trainer). בסביבה מסוננת vite לא ניתן להתקנה — הבנייה כאן
  trainer:
    runs-on: windows-latest
    env:
      LOG: ${{ github.workspace }}/ci-logs/trainer.log
    defaults:
      run:
        shell: bash
    steps:
      # היסטוריה מלאה: tests/at-rest.test.js קורא את database.js של 3.10.0 מ-git (בדיקת שדרוג)
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p ci-logs
      # עם קובץ נעילה — אותן גרסאות בדיוק בכל בנייה (npm ci); בלעדיו — npm install, והקובץ שנוצר נשמר ב-ci-status
      - name: npm install (trainer)
        working-directory: modules-src/trainer
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then CMD="npm ci"; else CMD="npm install"; fi
          { echo "== $CMD (trainer)"; $CMD 2>&1; } | tee -a "$LOG"
          cp package-lock.json "$GITHUB_WORKSPACE/ci-logs/trainer-package-lock.json"
      - name: npm install
        run: set -o pipefail; { echo "== npm install"; npm install 2>&1; } | tee -a "$LOG"
      - name: build trainer
        run: set -o pipefail; { echo "== build-trainer"; node tools/build-trainer.js 2>&1; } | tee -a "$LOG"
      - name: npm test
        run: set -o pipefail; { echo "== npm test"; npm test 2>&1; } | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: trainer-module
          path: modules/trainer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 2
          name: ci-logs-trainer
          path: ci-logs
  # המתקין אורז את מודול האימונים שנבנה מהמקור באותה ריצה (PLAN.md 6.1), לא את העותק שבמאגר
  build:
    needs: [trainer]
    runs-on: windows-latest
    env:
      LOG: ${{ github.workspace }}/ci-logs/build.log
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p ci-logs
      - name: מודול האימונים מהבנייה
        run: rm -rf modules/trainer
      - uses: actions/download-artifact@v4
        with:
          name: trainer-module
          path: modules/trainer
      - name: Release check
        if: ${{ inputs.release }}
        run: set -o pipefail; { echo "== release-check"; node tools/release-check.js 2>&1; } | tee -a "$LOG"
      - name: npm install
        run: set -o pipefail; { echo "== npm install"; npm install 2>&1; } | tee -a "$LOG"
      # --publish never: בלי זה electron-builder מזהה CI ומנסה לפרסם ל-GitHub Releases (ונכשל בלי GH_TOKEN).
      # פרסום גרסאות — משימת publish (PLAN.md 1.1), למאגר ההורדות הציבורי.
      # חתימת קוד — רק אם הוגדרו סודות במאגר (docs/CODE-SIGNING.md). בלי סודות: בנייה לא חתומה, כמו קודם.
      # טוקן USB אינו זמין בשרת של GitHub — כאן אפשר רק PFX או Azure Trusted Signing.
      - name: Build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SS_AZURE_ENDPOINT: ${{ secrets.SS_AZURE_ENDPOINT }}
          SS_AZURE_ACCOUNT: ${{ secrets.SS_AZURE_ACCOUNT }}
          SS_AZURE_PROFILE: ${{ secrets.SS_AZURE_PROFILE }}
          SS_SIGN_PUBLISHER: ${{ secrets.SS_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -o pipefail
          ARGS="$(node tools/code-signing.js --args)"
          { echo "== code-signing"; node tools/code-signing.js 2>&1; } | tee -a "$LOG"
          # כיווץ הקוד (PLAN.md 3.5) — במקום, בעותק של GitHub בלבד. הבדיקות הרגילות רצות במשימת trainer על הקוד המקורי
          { echo "== minify"; npm install --no-save esbuild 2>&1 && node tools/minify.js 2>&1; } | tee -a "$LOG"
          { echo "== electron-builder"; npx electron-builder --win nsis portable --publish never $ARGS 2>&1; } | tee -a "$LOG"
      # הגרסה הארוזה והמכווצת: עולה בלי שגיאות, ומסרבת לעלות עם פרמטר דיבוג או עם app.asar שהשתנה.
      # נכשל ← אין מתקין להורדה (השלבים הבאים מדולגים)
      - name: Smoke test (packaged)
        env:
          SMOKE_LOG: ${{ github.workspace }}/ci-logs/smoke.log
        run: set -o pipefail; { echo "== smoke"; node tools/smoke-packaged.js 2>&1; } | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: SuperSuite-Windows
          path: |
            dist/SuperSuite-Setup.exe
            dist/SuperSuite-Portable.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 2
          name: ci-logs-build
          path: ci-logs
  # פרסום למאגר ההורדות הציבורי (PLAN.md 1.1) — רק בהפעלה ידנית עם publish, ורק אחרי בנייה ובדיקת עלייה שעברו.
  # המאגר הזה פרטי; ההורדות במאגר ציבורי נפרד (משתנה SS_DOWNLOADS_REPO, למשל owner/SuperSuite-Downloads),
  # עם טוקן שמורשה לכתוב רק אליו (סוד SS_DOWNLOADS_TOKEN). מדריך: docs/DOWNLOADS.md.
  # קישור קבוע לגרסה האחרונה: https://github.com/<מאגר>/releases/latest/download/SuperSuite-Setup.exe
  publish:
    needs: [build]
    if: ${{ (inputs.publish || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: package.json, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v4
        with:
          name: SuperSuite-Windows
          path: out
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SS_DOWNLOADS_TOKEN }}
          REPO: ${{ vars.SS_DOWNLOADS_REPO }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$REPO" ]; then
            echo "חסרים SS_DOWNLOADS_TOKEN או SS_DOWNLOADS_REPO — ראו docs/DOWNLOADS.md"; exit 1
          fi
          V="$(node -p "require('./package.json').version")"
          # תגית שלא תואמת את package.json — טעות; לא מפרסמים
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "התגית ${GITHUB_REF_NAME} לא תואמת לגרסה v$V שב-package.json"; exit 1
          fi
          # גרסה שכבר פורסמה לא נדרסת — יש להעלות את מספר הגרסה ב-package.json
          if gh release view "v$V" --repo "$REPO" >/dev/null 2>&1; then
            echo "הגרסה v$V כבר פורסמה ב-$REPO"; exit 1
          fi
          gh release create "v$V" --repo "$REPO" --title "SuperSuite $V" --latest             --notes "SuperSuite גרסה $V" out/SuperSuite-Setup.exe out/SuperSuite-Portable.exe
          echo "פורסם: https://github.com/$REPO/releases/latest/download/SuperSuite-Setup.exe"
  # סיכום ויומנים לענף ci-status (קומיט יחיד, נדרס בכל ריצה). הענף לא מפעיל בנייה (רק master מפעיל)
  report:
    needs: [trainer, build, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      # מצב כל משימה וכל צעד, והודעות השגיאה של GitHub (למשל "Set up job" שנכשל) — גם כשמשימה נפלה לפני שכתבה יומן.
      # דף ה-Actions וה-API חסומים ב-NetFree, ולכן זה נכתב ל-ci-status (jobs.txt)
      - name: jobs summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          api() { curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"; }
          api "actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > jobs.json
          jq -r '.jobs[] | "\(.name): \(.conclusion // .status)", (.steps[]? | "  \(.number). \(.name): \(.conclusion // .status)")' jobs.json > logs/jobs.txt
          # נפח האחסון של ה-artifacts במאגר — העלאה שנכשלת בגלל מכסה מלאה
          api "actions/artifacts?per_page=100" | jq -r '"--- artifacts: \(.total_count), MB: \(([.artifacts[]?.size_in_bytes] | add // 0) / 1048576 | floor)"' >> logs/jobs.txt
          # הודעות השגיאה לכל משימה שאינה "success" (גם כשהיא עוד נסגרת בזמן שהדוח נכתב)
          for id in $(jq -r '.jobs[] | select(.name != "report" and .conclusion != "success" and .conclusion != "skipped") | .id' jobs.json); do
            echo "--- annotations: job $id" >> logs/jobs.txt
            api "check-runs/$id/annotations" | jq -r '.[]? | "\(.annotation_level): \(.message)"' >> logs/jobs.txt
          done
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-logs-*
          path: logs
          merge-multiple: true
      # המודול הבנוי עובר לענף ci-status: הורדת artifact חסומה ב-NetFree, ו-git fetch עובד.
      # במחשב: git fetch origin ci-status && git checkout FETCH_HEAD -- trainer-module (ואז העתקה ל-modules/trainer)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trainer-module
          path: logs/trainer-module
      - name: push ci-status
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs && cd logs
          printf 'run: %s (#%s)\nsha: %s\ntrainer: %s\nbuild: %s\npublish: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "${{ needs.trainer.result }}" "${{ needs.build.result }}" "${{ needs.publish.result }}" > summary.txt
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-status
          git add -A
          git commit -qm "CI #$GITHUB_RUN_NUMBER $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status
