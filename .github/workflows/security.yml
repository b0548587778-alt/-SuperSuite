name: Security scan
on:
  push:
    branches: [master, 'work/**', 'ci/**']
  pull_request:
  # סריקה שבועית: חולשות חדשות מתגלות גם בתלויות שלא השתנו
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
# כל כלי במשימה נפרדת: כישלון של אחד לא עוצר את האחרים
permissions:
  contents: read
jobs:
  # סודות (מפתחות, סיסמאות) בקוד ובכל היסטוריית ה-git
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ב-PR הפעולה קוראת את רשימת ה-commits של ה-PR (בלי זה: 403 ו"כישלון" בלי שנסרק דבר)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # הדוח מוצג ביומן ובסיכום הריצה; העלאת artifact נכשלה כשמכסת האחסון של החשבון התמלאה
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ניתוח סטטי של הקוד (JS ו-Python)
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # שני כללי "audit" (רמזים לבדיקה ידנית, לא ממצאים) — כמעט כל הפגיעות שלהם בכלי בנייה ובנתיבים קבועים;
      # path traversal בפרוטוקול app:// נבדק בבדיקות (tests/audit-backup-startup.test.js).
      # התרעות שווא אחרות — nosemgrep בשורה עצמה, עם נימוק (החלטת הבעלים 1.11.2026)
      - run: >-
          semgrep scan --config auto --error --exclude node_modules --exclude dist --exclude build --exclude modules
          --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal
          --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp

  # ניתוח סטטי של GitHub; התוצאות בלשונית Security של המאגר
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Code scanning לא זמין במאגר (פרטי, בלי GitHub Advanced Security): הסריקה רצה בלי העלאה,
    # והמשימה נכשלת לפי הממצאים בקובץ התוצאות (החלטת הבעלים 1.11.2026)
    permissions:
      contents: read
      # codeql-action קורא את פרטי הריצה (בלי זה: "configuration error" אחרי שהסריקה הסתיימה)
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          upload: never
          output: codeql-results
      # כל ממצא בקובץ התוצאות — מודפס ומכשיל את המשימה, חוץ מחריגים מאושרים עם נימוק
      # (.github/codeql/allowlist.json: כלל + קובץ — חריג לא חל על קובץ אחר)
      - name: ממצאי CodeQL
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          [ ${#files[@]} -gt 0 ] || { echo "לא נוצר קובץ תוצאות"; exit 1; }
          jq -s -r --slurpfile allow .github/codeql/allowlist.json '
            [ .[].runs[].results[]
              | { rule: .ruleId, path: .locations[0].physicalLocation.artifactLocation.uri,
                  line: .locations[0].physicalLocation.region.startLine, msg: .message.text } ]
            | map(. as $r | . + { allowed: ($allow[0] | any(.rule == $r.rule and .path == $r.path)) })
            | .[] | "\(if .allowed then "מאושר" else "ממצא" end)  \(.rule)  \(.path):\(.line)  \(.msg)"' "${files[@]}" | tee findings.txt
          count=$(grep -c '^ממצא ' findings.txt || true)
          echo "ממצאים שלא אושרו: $count"
          [ "$count" -eq 0 ]

  # תלויות עם חולשות ידועות
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # כל העץ, גם Electron וכלי הבנייה (devDependencies): עם --omit=dev הבדיקה לא התריעה על Electron
      # שכבר לא נתמכת (סקירת קוד 2.11.2026)
      - name: npm audit (ראשי)
        run: npm audit --audit-level=high
      # קובצי הנעילה הייעודיים: רכיב ההרצה של המודל המקומי ו-esbuild לכיווץ
      - name: npm audit (llm-runtime, minify)
        run: |
          (cd tools/llm-runtime-deps && npm audit --audit-level=high)
          (cd tools/minify-deps && npm audit --audit-level=high)
      # Electron מקבלת תיקוני אבטחה רק בשלוש הגרסאות הראשיות האחרונות — גרסה ישנה יותר נכשלת כאן במפורש
      - name: Electron נתמכת
        run: node tools/electron-support.js "$(npm view electron dist-tags.latest)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: pip-audit (כלי הסיסמאות)
        run: |
          pip install pip-audit
          pip-audit -r tools/passwords/requirements.txt
